name: VulkanMod 1.21.8 Port CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare VulkanMod source
        run: |
          git clone https://github.com/xCollateral/VulkanMod.git src
          cd src
          git checkout 67e20f1f359a3a0611e2312a8a72e47fc9a09737
      - name: Port build configuration to 1.21.8
        run: |
          cd src
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('build.gradle')
          s = p.read_text()
          s = s.replace("id 'fabric-loom' version '1.12-SNAPSHOT'", "id 'fabric-loom' version '1.11-SNAPSHOT'")
          s = s.replace('\tincludeModule("fabric-resource-loader-v1")\n', '')
          p.write_text(s)

          p = Path('gradle.properties')
          s = p.read_text()
          s = re.sub(r'minecraft_version\s*=\s*[^\n]+', 'minecraft_version=1.21.8', s)
          s = re.sub(r'yarn_mappings\s*=\s*[^\n]+', 'yarn_mappings=1.21.8+build.1', s)
          s = re.sub(r'loader_version\s*=\s*[^\n]+', 'loader_version=0.17.3', s)
          s = re.sub(r'fabric_version\s*=\s*[^\n]+', 'fabric_version=0.136.1+1.21.8', s)
          s = re.sub(r'mod_version\s*=\s*[^\n]+', 'mod_version = 0.6.6+1.21.8-port', s)
          s = re.sub(r'archives_base_name\s*=\s*[^\n]+', 'archives_base_name = VulkanMod_1.21.8', s)
          p.write_text(s)

          p = Path('src/main/resources/fabric.mod.json')
          s = p.read_text()
          s = re.sub(r'"minecraft"\s*:\s*\[[^\]]*\]', '"minecraft": ["1.21.8"]', s)
          p.write_text(s)
          PY
      - name: Build
        run: |
          cd src
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee ../build.log
      - name: Collect JAR
        if: success()
        run: |
          mkdir -p out
          find src/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' -exec cp {} out/ \;
          ls -lah out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VulkanMod-1.21.8-iteration
          path: |
            out/*.jar
            build.log
          if-no-files-found: warn
